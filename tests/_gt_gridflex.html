<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: sans-serif; }
  #grid { display:grid; grid-template-columns:1fr 1fr; width:500px; height:100px; gap:8px; outline:2px solid red; }
  .flex { display:flex; flex-direction:row; outline:1px solid blue; }
  .flex2 { display:flex; flex-direction:row; justify-content:center; outline:1px solid green; }
  .box { width:40px; height:30px; }
</style></head><body>
  <div id="grid">
    <div class="flex" id="f1"><div class="box" style="background:#F00">A</div><div class="box" style="background:#0F0">B</div></div>
    <div class="flex2" id="f2"><div class="box" style="background:#00F">C</div></div>
  </div>
  <pre id="out"></pre>
  <script>
    function rect(id){ var e=document.getElementById(id); var r=e.getBoundingClientRect(); return id+': '+Math.round(r.left)+','+Math.round(r.top)+' '+Math.round(r.width)+'x'+Math.round(r.height); }
    document.getElementById('out').textContent = [rect('grid'), rect('f1'), rect('f2')].join('\n');
  </script>
</body></html>

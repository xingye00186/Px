<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试模板 4：博客文章列表</title>
    <style>
        * { margin:0; padding:0; box-sizing: border-box; }
        body {
            background: #fef9e8;
            font-family: 'Georgia', 'Times New Roman', '宋体', serif;
            padding: 40px 24px;
        }
        .blog-container {
            max-width: 900px;
            margin: 0 auto;
        }
        .blog-header {
            text-align: center;
            margin-bottom: 48px;
        }
        .blog-header h1 {
            font-size: 2.8rem;
            letter-spacing: -1px;
            color: #3b2a1f;
        }
        .blog-header p {
            color: #7c6e5d;
            font-style: italic;
        }
        /* 文章列表 Flex 列 */
        .posts {
            display: flex;
            flex-direction: column;
            gap: 32px;
        }
        .post-item {
            background: white;
            border-radius: 24px;
            padding: 24px 28px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            display: flex;
            gap: 20px;
            align-items: flex-start;
            flex-wrap: wrap;
        }
        .post-icon {
            width: 60px;
            height: 60px;
            background: #fde68a;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            flex-shrink: 0;
        }
        .post-content {
            flex: 1;
        }
        .post-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #2d2a24;
        }
        .post-meta {
            display: flex;
            gap: 16px;
            margin-bottom: 12px;
            font-size: 0.8rem;
            color: #aa9d8c;
        }
        .post-excerpt {
            color: #4a443c;
            line-height: 1.6;
            margin-bottom: 12px;
        }
        .tag {
            display: inline-block;
            background: #f3f0e9;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #8b7355;
            margin-right: 8px;
        }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 48px;
        }
        .page {
            background: white;
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid #e2dcd2;
            cursor: pointer;
        }
        .page.active {
            background: #3b2a1f;
            color: white;
            border-color: #3b2a1f;
        }
        @media (max-width: 600px) {
            .post-item { flex-direction: column; }
            .post-icon { width: 48px; height: 48px; }
        }
    </style>
</head>
<body>
<div class="blog-container">
    <div class="blog-header">
        <h1>墨韵·随笔</h1>
        <p>设计 / 技术 / 生活</p>
    </div>
    <div class="posts">
        <div class="post-item">
            <div class="post-icon">✍️</div>
            <div class="post-content">
                <div class="post-title">CSS Grid 完全指南</div>
                <div class="post-meta"><span>2025-03-15</span><span>📖 8分钟阅读</span></div>
                <div class="post-excerpt">Grid 布局是现代网页设计的基石，本文详解 fr 单位、隐式网格与响应式技巧...</div>
                <div><span class="tag">CSS</span><span class="tag">布局</span></div>
            </div>
        </div>
        <div class="post-item">
            <div class="post-icon">🎨</div>
            <div class="post-content">
                <div class="post-title">设计系统中的颜色策略</div>
                <div class="post-meta"><span>2025-03-10</span><span>🎨 5分钟阅读</span></div>
                <div class="post-excerpt">如何构建可扩展的调色板，从 HSL 到 CSS 自定义属性，打造一致品牌视觉。</div>
                <div><span class="tag">设计</span><span class="tag">UI</span></div>
            </div>
        </div>
        <div class="post-item">
            <div class="post-icon">⚡</div>
            <div class="post-content">
                <div class="post-title">前端性能优化实战</div>
                <div class="post-meta"><span>2025-03-05</span><span>⚙️ 12分钟阅读</span></div>
                <div class="post-excerpt">从代码拆分到图片懒加载，提升 Core Web Vitals 的 7 个实用技巧。</div>
                <div><span class="tag">性能</span><span class="tag">前端</span></div>
            </div>
        </div>
    </div>
    <div class="pagination">
        <div class="page">1</div>
        <div class="page active">2</div>
        <div class="page">3</div>
        <div class="page">→</div>
    </div>
</div>
</body>
</html>

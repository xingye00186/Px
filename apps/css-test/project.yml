name: css-test
mode: bin
no-console: false
job: 8
platform: win32
entry: main.php
Px_dynamic_component_file: test_case
# 并发构建隔离：tpc 的 --build-dir 默认是 <root>/build，多个 app 同时编译会
# 写同一目录而互相污染 C++ 中间产物。按 app 分目录后各自独立。
# （tpc v0.4.0 --help: "--build-dir <dir>  Specify build directory for generated
#  C++ code (default: <root>/build)"）
# 注：本项只解决**产物目录冲突**。真并发还需 build.bat 侧两个改动：
#   (a) L5-7 taskkill cl.exe/link.exe/mspdbsrv.exe 会杀掉并发构建的编译进程；
#   (b) L297+ rmdir /s /q "%FRAMEWORK_ROOT%\build" 清空**共享** build 根（由
#       config.yml 的 Px_clear_compilation_cache 门控），会抹除另一构建的产物。
# 两者均为 .bat 改动，不得在构建运行中修改（cmd.exe 逐行读取 .bat）。
build-dir: build/reactive-bench
cxx-flags:
  - /utf-8
  - /FS
  # Skia 静态库需要 /MT（静态 CRT），否则 LNK2038 运行时库不匹配
  - /MT
  - /DUSE_SKIA
  - /I"cpp/skia"
  # 阶段三 / 四需要的宏定义（即便当前不是 OpenGL 路径）
  - /DGR_GL_FUNCTION_TYPE=__stdcall
ld-flags:
  # AOT 转译后 PHP 函数栈帧远大于 Zend VM 虚拟栈，默认 1MB 链接栈在大 case
  # （case-029: 1210 节点/254 兄弟）触发 0xC00000FD STACK_OVERFLOW。
  # 对齐 PHP CLI 栈规格 8MB（php.exe /STACK 同档）——编译期治本。
  - /STACK:8388608
  # Skia 静态库（按链接依赖顺序，依赖者在前）
  - cpp/skia/out/Release-x64/skia.lib
  - cpp/skia/out/Release-x64/skunicode_icu.lib
  - cpp/skia/out/Release-x64/icu.lib
  - cpp/skia/out/Release-x64/skcms.lib
  - cpp/skia/out/Release-x64/expat.lib
  - cpp/skia/out/Release-x64/freetype2.lib
  - cpp/skia/out/Release-x64/harfbuzz.lib
  - cpp/skia/out/Release-x64/libpng.lib
  - cpp/skia/out/Release-x64/zlib.lib
  - cpp/skia/out/Release-x64/libjpeg.lib
  - cpp/skia/out/Release-x64/libwebp.lib
  - cpp/skia/out/Release-x64/sksg.lib
  - cpp/skia/out/Release-x64/skshaper.lib
  - cpp/skia/out/Release-x64/skresources.lib
  - cpp/skia/out/Release-x64/skparagraph.lib
  - cpp/skia/out/Release-x64/skunicode_core.lib
  - cpp/skia/out/Release-x64/skottie.lib
  - cpp/skia/out/Release-x64/svg.lib
  - cpp/skia/out/Release-x64/wuffs.lib
  - cpp/skia/out/Release-x64/bentleyottmann.lib
  - cpp/skia/out/Release-x64/jsonreader.lib
  # Windows 系统库
  - d3d12.lib
  - dxgi.lib
  - d3dcompiler.lib
  - windowscodecs.lib
  - user32.lib
  - gdi32.lib
  - opengl32.lib

sources:
  - main.php
  - ./gen
  - ../../framework
  - ../../stub
  - ../../cpp
ignore:
  - ../../framework/Compiler


# 每次构建前清理编译缓存
Px_clear_compilation_cache: true

# 文本引擎配置：可选 dwrite / skia / gdi，不设置则自动选择（默认 dwrite）
# Px_text_engine: dwrite
# Px_text_engine_verbose: false

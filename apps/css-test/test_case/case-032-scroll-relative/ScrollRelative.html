<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>Scroll + Absolute Children</title>
<style>
/* PxTest baseline — mandatory: viewport + font + background */
html,body {
    width:1600px;
    min-height:800px;
    height:auto;
    overflow:hidden;
    font-family:"Segoe UI","Noto Sans SC",sans-serif;
    font-size:16px;
    line-height:1.2;
    background:#fff;
    color:#000;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #f5f5f5; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
.card { width:800px; margin:0 auto; background:#fff; border-radius:12px; padding:24px; border:1px solid #e0e0e0; box-shadow:0 2px 12px rgba(0,0,0,.08); position:relative; }
.scroll-box { height:300px; overflow-y:auto; border:2px solid #c62828; border-radius:6px; background:#fafafa; position:relative; }
.badge { position:absolute; background:#c62828; color:#fff; font-size:10px; padding:2px 8px; border-radius:4px; z-index:10; }
.badge-blue { position:absolute; background:#1565c0; color:#fff; font-size:10px; padding:2px 8px; border-radius:4px; z-index:10; }
.item { height:36px; display:flex; align-items:center; padding:0 14px; font-size:13px; border-bottom:1px solid #e0e0e0; }
.item:nth-child(4n+1) { background:#ffebee; }
.item:nth-child(4n+2) { background:#ffffff; }
.item:nth-child(4n+3) { background:#f5f5f5; }
.item:nth-child(4n+4) { background:#fce4ec; }
.num { display:inline-block; width:36px; font-weight:700; color:#c62828; }
.label { color:#37474f; }
.hint { margin-left:10px; font-size:11px; color:#aaa; }
</style>

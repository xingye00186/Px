<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Text ― Emphasis &amp; Content</title>
<style>
html,body { width:1600px; min-height:800px; height:auto; overflow:hidden; font-family:"Segoe UI","Noto Sans SC",sans-serif; font-size:16px; line-height:1.2; background:#fff; color:#000; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#f0f2f5; font-family:sans-serif; padding:20px; }
.bx-header { font-size:20px; font-weight:700; margin-bottom:20px; color:#1a1a2e; border-bottom:2px solid #e94560; padding-bottom:12px; }
.te-row { display:flex; flex-direction:column; gap:16px; margin-bottom:16px; }
.te-item { padding:16px; background:#f9f9f9; border-radius:6px; border:1px solid #e0e0e0; }
.te-label { font-size:14px; color:#666; margin-bottom:4px; }
.te-circle { font-size:22px; color:#333; text-emphasis:circle #e94560; }
.te-dot { font-size:22px; color:#333; text-emphasis:dot #4facfe; }
.te-content { font-size:16px; color:#333; }
.te-content::before { content: attr(data-label); color:#e94560; margin-right:4px; }
.te-quotes { font-size:18px; color:#333; quotes:'「' '」'; }
.te-quotes q::before { content:open-quote; }
.te-quotes q::after { content:close-quote; }
.bx-footer { margin-top:16px; padding-top:14px; border-top:1px solid #eee; font-size:12px; color:#aaa; text-align:center; }
</style></head><body>
<div style="width:800px;box-sizing:border-box;background:#fff;border-radius:8px;padding:24px;border:1px solid #e0e0e0;position:relative">
<div data-px-anchor="tl" style="position:absolute;top:0;left:0;width:8px;height:8px;background:#FF00FF;pointer-events:none;"></div>
  <div class="bx-header">??? 文本 ・ Text-Emphasis 与 Content 生成测试</div>
  <div class="te-row">
    <div class="te-item"><div class="te-label">text-emphasis: circle red（圈点强调）</div><div class="te-circle">强调文字效果</div></div>
    <div class="te-item"><div class="te-label">text-emphasis: dot blue（点状强调）</div><div class="te-dot">点状文字强调</div></div>
    <div class="te-item"><div class="te-label">content: attr(data-label) 生成内容</div><div class="te-content" data-label="★ 生成内容">元素内容 <span style="color:#e94560;">::before { content: attr(data-label) }</span></div></div>
    <div class="te-item"><div class="te-label">quotes 引号样式</div><div class="te-quotes">CSS 引号嵌套<q>内层引用<q>更深层</q></q>测试</div></div>
  </div>
  <div class="bx-footer">case-050: Text ― Emphasis &amp; Content</div>
<div data-px-anchor="br" style="position:absolute;bottom:0;right:0;width:8px;height:8px;background:#00FFFF;pointer-events:none;"></div></div>
</body></html>

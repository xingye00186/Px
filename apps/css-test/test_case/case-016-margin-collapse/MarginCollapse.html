<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Layout ― Margin Collapse</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#f0f2f5; font-family:sans-serif; display:flex; justify-content:center; padding:20px; }
  .bx-card { width:720px; background:#fff; border-radius:12px; padding:28px; box-shadow:0 2px 12px rgba(0,0,0,.08);position:relative;}
  .bx-header { font-size:20px; font-weight:700; margin-bottom:20px; color:#1a1a2e; border-bottom:2px solid #e94560; padding-bottom:12px; }
  .bx-desc { font-size:13px; color:#888; margin-bottom:16px; line-height:1.5; }
  .mc-container { background:#f8f9ff; border-radius:8px; padding:4px; border:1px solid #e0e0e0; margin-bottom:16px; }
  .mc-a { margin-bottom:30px; padding:16px; background:linear-gradient(135deg,#667eea,#764ba2); border-radius:6px; color:#fff; text-align:center; }
  .mc-b { margin-top:20px; padding:16px; background:linear-gradient(135deg,#e94560,#f093fb); border-radius:6px; color:#fff; text-align:center; }
  .mc-note { font-size:11px; color:#888; padding:8px; text-align:center; }
  .bx-footer { margin-top:16px; padding-top:14px; border-top:1px solid #eee; font-size:12px; color:#aaa; text-align:center; }
</style></head><body>
<div class="bx-card">
<div data-px-anchor="tl" style="position:absolute;top:0;left:0;width:8px;height:8px;background:#FF00FF;pointer-events:none;"></div>
  <div class="bx-header">?? 布局 ・ Margin 折叠测试</div>
  <div class="bx-desc">相邻块级元素 margin-bottom + margin-top 应折叠为较大值(而非相加)</div>
  <div class="mc-container">
    <div class="mc-a">A: margin-bottom: 30px</div>
    <div class="mc-b">B: margin-top: 20px</div>
    <div class="mc-note">A与B间距应 = max(30,20) = 30px (而非 50px)</div>
  </div>
  <div class="bx-footer">case-016: Layout ― Margin Collapse</div>

<div data-px-anchor="br" style="position:absolute;bottom:0;right:0;width:8px;height:8px;background:#00FFFF;pointer-events:none;"></div></div>
</body></html>

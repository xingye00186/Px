<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Text ― Font Style</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#f0f2f5; font-family:sans-serif; display:flex; justify-content:center; padding:20px; }
  .bx-card { width:720px; background:#fff; border-radius:12px; padding:28px; box-shadow:0 2px 12px rgba(0,0,0,.08);position:relative;}
  .bx-header { font-size:20px; font-weight:700; margin-bottom:20px; color:#1a1a2e; border-bottom:2px solid #e94560; padding-bottom:12px; }
  .fs-row { display:flex; gap:16px; margin-bottom:16px; flex-wrap:wrap; }
  .fs-row div { flex:1; min-width:180px; padding:16px; background:#f8f9ff; border-radius:8px; border:1px solid #e0e0e0; text-align:center; }
  .bx-footer { margin-top:16px; padding-top:14px; border-top:1px solid #eee; font-size:12px; color:#aaa; text-align:center; }
</style></head><body>
<div class="bx-card">
<div data-px-anchor="tl" style="position:absolute;top:0;left:0;width:8px;height:8px;background:#FF00FF;pointer-events:none;"></div>
  <div class="bx-header">?? 文本 ・ 样式综合测试</div>
  <div class="fs-row">
    <div><div style="font-size:11px;color:#999;margin-bottom:8px;">italic 斜体</div><div style="font-style:italic;font-size:18px;">Italic</div></div>
    <div><div style="font-size:11px;color:#999;margin-bottom:8px;">underline 下划线</div><div style="text-decoration:underline;font-size:18px;">Underline</div></div>
    <div><div style="font-size:11px;color:#999;margin-bottom:8px;">italic + bold</div><div style="font-style:italic;font-weight:700;font-size:18px;color:#0f3460;">Bold Italic</div></div>
  </div>
  <div class="bx-footer">case-026: Text ― Font Style</div>

<div data-px-anchor="br" style="position:absolute;bottom:0;right:0;width:8px;height:8px;background:#00FFFF;pointer-events:none;"></div></div>
</body></html>

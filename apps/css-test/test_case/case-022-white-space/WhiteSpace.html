<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Text ― White Space / Overflow</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#f0f2f5; font-family:sans-serif; display:flex; justify-content:center; padding:20px; }
  .bx-card { width:720px; background:#fff; border-radius:12px; padding:28px; box-shadow:0 2px 12px rgba(0,0,0,.08);position:relative;}
  .bx-header { font-size:20px; font-weight:700; margin-bottom:20px; color:#1a1a2e; border-bottom:2px solid #e94560; padding-bottom:12px; }
  .ws-section { margin-bottom:12px; padding:14px; background:#f8f9ff; border-radius:8px; border:1px solid #e0e0e0; }
  .ws-ellipsis { width:300px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:14px; color:#444; padding:8px; background:#fff; border-radius:4px; border:1px solid #eee; }
  .ws-pre { white-space:pre; font-size:14px; color:#444; padding:8px; background:#fff; border-radius:4px; border:1px solid #eee; font-family:monospace; }
  .bx-footer { margin-top:16px; padding-top:14px; border-top:1px solid #eee; font-size:12px; color:#aaa; text-align:center; }
</style></head><body>
<div class="bx-card">
<div data-px-anchor="tl" style="position:absolute;top:0;left:0;width:8px;height:8px;background:#FF00FF;pointer-events:none;"></div>
  <div class="bx-header">?? 文本 ・ 空白/溢出测试</div>
  <div class="ws-section"><div>white-space: nowrap + text-overflow: ellipsis</div><div class="ws-ellipsis">这是一段非常长的文本内容，超长时应该显示省略号而不是换行显示</div></div>
  <div class="ws-section"><div>white-space: pre (保留空格和换行)</div><div class="ws-pre">保留    空格
保留换行
缩进效果</div></div>
  <div class="bx-footer">case-022: Text ― White Space / Overflow</div>

<div data-px-anchor="br" style="position:absolute;bottom:0;right:0;width:8px;height:8px;background:#00FFFF;pointer-events:none;"></div></div>
</body></html>

<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Text ― Text-Decoration</title>
<style>
html,body { width:1600px; min-height:800px; height:auto; overflow:hidden; font-family:"Segoe UI","Noto Sans SC",sans-serif; font-size:16px; line-height:1.2; background:#fff; color:#000; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#f0f2f5; font-family:sans-serif; padding:20px; }
.bx-header { font-size:20px; font-weight:700; margin-bottom:20px; color:#1a1a2e; border-bottom:2px solid #e94560; padding-bottom:12px; }
.td-row { display:flex; flex-direction:column; gap:16px; margin-bottom:16px; }
.td-item { padding:16px; background:#f9f9f9; border-radius:6px; border:1px solid #e0e0e0; }
.td-label { font-size:14px; color:#666; margin-bottom:4px; }
.td-u { font-size:20px; color:#c62828; text-decoration:underline; }
.td-o { font-size:20px; color:#0f3460; text-decoration:overline; }
.td-lt { font-size:20px; color:#2e7d32; text-decoration:line-through; }
.td-wavy { font-size:20px; color:#6a1b9a; text-decoration:underline wavy #e94560 2px; }
.td-both { font-size:20px; color:#e65100; text-decoration:underline overline; }
.bx-footer { margin-top:16px; padding-top:14px; border-top:1px solid #eee; font-size:12px; color:#aaa; text-align:center; }
</style></head><body>
<div style="width:800px;box-sizing:border-box;background:#fff;border-radius:8px;padding:24px;border:1px solid #e0e0e0;position:relative">
<div data-px-anchor="tl" style="position:absolute;top:0;left:0;width:8px;height:8px;background:#FF00FF;pointer-events:none;"></div>
  <div class="bx-header">??? 文本 ・ Text-Decoration 修饰渲染测试</div>
  <div class="td-row">
    <div class="td-item"><div class="td-label">text-decoration: underline</div><div class="td-u">这是一段带下划线的文字</div></div>
    <div class="td-item"><div class="td-label">text-decoration: overline</div><div class="td-o">这是一段带上划线的文字</div></div>
    <div class="td-item"><div class="td-label">text-decoration: line-through</div><div class="td-lt">这是一段带删除线的文字</div></div>
    <div class="td-item"><div class="td-label">text-decoration: underline wavy red 2px</div><div class="td-wavy">波浪线下划线</div></div>
    <div class="td-item"><div class="td-label">text-decoration: underline overline</div><div class="td-both">同时上下划线</div></div>
  </div>
  <div class="bx-footer">case-045: Text ― Text-Decoration</div>
<div data-px-anchor="br" style="position:absolute;bottom:0;right:0;width:8px;height:8px;background:#00FFFF;pointer-events:none;"></div></div>
</body></html>

<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>case-055: sticky multi-scroll</title>
<style>
html,body {width:1600px;height:800px;overflow:hidden;font-family:"Segoe UI","Noto Sans SC",sans-serif;font-size:16px;line-height:1.2;background:#fff;color:#000;}
* {box-sizing: border-box; margin: 0; padding: 0;line-height:0;}
body {background:#f0f2f5;display:flex;justify-content:center;padding:20px;}
</style></head><body>
<div style="width:800px;box-sizing:border-box;background:#fff;border-radius:8px;padding:24px;border:1px solid #e0e0e0;position:relative">
<div data-px-anchor="tl" style="position:absolute;top:0;left:0;width:8px;height:8px;background:#FF00FF;pointer-events:none"></div>
  <div style="height:300px;overflow-y:auto;background:#f5f5f5;border-radius:4px;border:1px solid #e0e0e0"><div style="position:sticky;top:0;background:#e3f2fd;height:36px;display:flex;align-items:center;padding:0 12px"><span style="display:inline-block;width:100px;height:25px;background:#b0b0b0"></span></div><div style="height:100px;background:#fff;margin:8px;border-radius:3px;display:flex;align-items:center;justify-content:center"><span style="display:inline-block;width:80px;height:25px;background:#9a9a9a"></span></div><div style="height:100px;background:#fff;margin:8px;border-radius:3px;display:flex;align-items:center;justify-content:center"><span style="display:inline-block;width:80px;height:25px;background:#a8a8a8"></span></div><div style="height:100px;background:#fff;margin:8px;border-radius:3px;display:flex;align-items:center;justify-content:center"><span style="display:inline-block;width:80px;height:25px;background:#929292"></span></div></div>
<div data-px-anchor="br" style="position:absolute;bottom:0;right:0;width:8px;height:8px;background:#00FFFF;pointer-events:none"></div></div>
</body></html>

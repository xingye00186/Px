<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Layout ― Overflow Hidden</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#f0f2f5; font-family:sans-serif; display:flex; justify-content:center; padding:20px; }
  .bx-card { width:720px; background:#fff; border-radius:12px; padding:28px; box-shadow:0 2px 12px rgba(0,0,0,.08);position:relative;}
  .bx-header { font-size:20px; font-weight:700; margin-bottom:20px; color:#1a1a2e; border-bottom:2px solid #e94560; padding-bottom:12px; }
  .bx-desc { font-size:13px; color:#888; margin-bottom:16px; line-height:1.5; }
  .oh-container { width:250px; height:120px; overflow:hidden; border:2px solid #0f3460; border-radius:8px; margin:0 auto 16px; position:relative; background:#f8f9ff; }
  .oh-content { width:300px; height:80px; background:linear-gradient(90deg,#4ade80,#38f9d7); border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:13px; color:#333; position:relative; top:20px; }
  .oh-over { width:200px; height:50px; background:#e94560; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; margin-top:10px; }
  .bx-footer { margin-top:16px; padding-top:14px; border-top:1px solid #eee; font-size:12px; color:#aaa; text-align:center; }
</style></head><body>
<div class="bx-card">
<div style="position:absolute;top:0;left:0;width:8px;height:8px;background:#FF00FF;pointer-events:none;"></div>
  <div class="bx-header">?? 布局 ・ Overflow Hidden 裁切测试</div>
  <div class="bx-desc">容器 overflow:hidden，宽250高120，超出的绿色块应被裁切</div>
  <div class="oh-container">
    <div class="oh-content">宽度300 > 容器250</div>
    <div class="oh-over">还在可视区</div>
  </div>
  <div class="bx-desc" style="background:#fafafa;padding:12px;border-radius:6px;">? overflow:hidden 应对超出部分进行裁切，不显示滚动条。</div>
  <div class="bx-footer">case-014: Layout ― Overflow Hidden</div>

<div style="position:absolute;bottom:0;right:0;width:8px;height:8px;background:#00FFFF;pointer-events:none;"></div></div>
</body></html>

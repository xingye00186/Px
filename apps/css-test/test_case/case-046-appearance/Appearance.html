<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>UI ― Appearance &amp; Cursor</title>
<style>
html,body { width:1600px; min-height:800px; height:auto; overflow:hidden; font-family:"Segoe UI","Noto Sans SC",sans-serif; font-size:16px; line-height:1.2; background:#fff; color:#000; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#f0f2f5; font-family:sans-serif; padding:20px; }
.bx-header { font-size:20px; font-weight:700; margin-bottom:20px; color:#1a1a2e; border-bottom:2px solid #e94560; padding-bottom:12px; }
.ap-row { display:flex; flex-direction:column; gap:16px; margin-bottom:16px; }
.ap-item { padding:16px; background:#f9f9f9; border-radius:6px; border:1px solid #e0e0e0; }
.ap-label { font-size:14px; color:#666; margin-bottom:4px; }
.ap-select { appearance:none; padding:4px 8px; border:1px solid #90caf9; border-radius:4px; font-size:14px; }
.ap-cb { appearance:none; width:16px; height:16px; border:1px solid #e94560; margin-left:8px; }
.ap-pointer { padding:8px 16px; background:#e3f2fd; border-radius:4px; cursor:pointer; display:inline-block; }
.ap-text { cursor:text; background:#fff3e0; padding:4px 8px; margin-right:8px; }
.ap-wait { cursor:wait; background:#e8f5e9; padding:4px 8px; margin-right:8px; }
.ap-crosshair { cursor:crosshair; background:#fce4ec; padding:4px 8px; }
.bx-footer { margin-top:16px; padding-top:14px; border-top:1px solid #eee; font-size:12px; color:#aaa; text-align:center; }
</style></head><body>
<div style="width:800px;box-sizing:border-box;background:#fff;border-radius:8px;padding:24px;border:1px solid #e0e0e0;position:relative">
<div data-px-anchor="tl" style="position:absolute;top:0;left:0;width:8px;height:8px;background:#FF00FF;pointer-events:none;"></div>
  <div class="bx-header">??? 界面 ・ Appearance 与 Cursor 测试</div>
  <div class="ap-row">
    <div class="ap-item"><div class="ap-label">appearance: none（移除默认样式）</div><select class="ap-select"><option>选项一</option><option>选项二</option></select><input type="checkbox" class="ap-cb"></div>
    <div class="ap-item"><div class="ap-label">cursor: pointer</div><div class="ap-pointer">鼠标悬停变为手型</div></div>
    <div class="ap-item"><div class="ap-label">cursor: text / wait / crosshair</div><div><span class="ap-text">text光标</span><span class="ap-wait">wait等待</span><span class="ap-crosshair">crosshair十字</span></div></div>
    <div class="ap-item"><div class="ap-label">appearance: auto（默认浏览器样式）</div><input type="text" value="默认输入框" style="border:1px solid #ccc;padding:4px;font-size:14px;"></div>
  </div>
  <div class="bx-footer">case-046: UI ― Appearance &amp; Cursor</div>
<div data-px-anchor="br" style="position:absolute;bottom:0;right:0;width:8px;height:8px;background:#00FFFF;pointer-events:none;"></div></div>
</body></html>

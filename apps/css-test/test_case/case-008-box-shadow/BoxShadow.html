<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Box Model ― Box Shadow</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#f0f2f5; font-family:sans-serif; padding:20px; }
.bx-card { width:800px; background:#fff; border-radius:12px; padding:28px; position:relative; }
.bx-header { font-size:20px; font-weight:700; margin-bottom:20px; color:#1a1a2e; border-bottom:2px solid #e94560; padding-bottom:12px; }
.bx-grid { display:flex; gap:20px; flex-wrap:wrap; justify-content:center; margin-bottom:24px; }
.s-box { width:160px; height:100px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:13px; color:#fff; }
.bx-footer { margin-top:20px; padding-top:14px; border-top:1px solid #eee; font-size:12px; color:#aaa; text-align:center; }
</style></head><body>
<div class="bx-card">
<div style="position:absolute;top:0;left:0;width:8px;height:8px;background:#FF00FF;pointer-events:none;"></div>
  <div class="bx-header">? 盒模型 ・ 阴影测试</div>
  <div class="bx-grid">
    <div class="s-box" style="background:linear-gradient(135deg,#667eea,#764ba2);box-shadow:0 4px 15px rgba(102,126,234,.4);">小阴影</div>
    <div class="s-box" style="background:linear-gradient(135deg,#f093fb,#f5576c);box-shadow:0 8px 30px rgba(245,87,108,.45);">大阴影</div>
    <div class="s-box" style="background:linear-gradient(135deg,#4facfe,#00f2fe);border-radius:50%;box-shadow:0 0 20px rgba(79,172,254,.5);">发光</div>
    <div class="s-box" style="background:linear-gradient(135deg,#43e97b,#38f9d7);box-shadow:inset 0 2px 8px rgba(0,0,0,.15);color:#333;">内阴影</div>
  </div>
  <div class="bx-footer">case-008: Box Model ― Box Shadow</div>

<div style="position:absolute;bottom:0;right:0;width:8px;height:8px;background:#00FFFF;pointer-events:none;"></div></div>
</body></html>

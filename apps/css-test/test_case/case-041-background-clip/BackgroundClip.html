<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Background ― Clip &amp; Origin</title>
<style>
html,body { width:1600px; min-height:800px; height:auto; overflow:hidden; font-family:"Segoe UI","Noto Sans SC",sans-serif; font-size:16px; line-height:1.2; background:#fff; color:#000; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#f0f2f5; font-family:sans-serif; padding:20px; }
.bx-header { font-size:20px; font-weight:700; margin-bottom:20px; color:#1a1a2e; border-bottom:2px solid #e94560; padding-bottom:12px; }
.bc-row { display:flex; flex-direction:column; gap:16px; margin-bottom:16px; }
.bc-item { padding:16px; border-radius:6px; border:1px solid #ccc; }
.bc-label { font-size:14px; color:#666; margin-bottom:4px; }
.bc-box { width:200px; height:60px; border:4px dashed #e94560; padding:8px; color:#fff; font-size:13px; background:linear-gradient(135deg,#4facfe,#00f2fe); }
.bc-border { background-clip:border-box; }
.bc-padding { background-clip:padding-box; }
.bc-content { background-clip:content-box; }
.bc-origin { width:200px; height:60px; border:4px dashed #4ade80; padding:8px; color:#333; font-size:13px; background:linear-gradient(135deg,#a8edea,#fed6e3); background-origin:content-box; background-repeat:no-repeat; }
.bx-footer { margin-top:16px; padding-top:14px; border-top:1px solid #eee; font-size:12px; color:#aaa; text-align:center; }
</style></head><body>
<div style="width:800px;box-sizing:border-box;background:#fff;border-radius:8px;padding:24px;border:1px solid #e0e0e0;position:relative">
<div data-px-anchor="tl" style="position:absolute;top:0;left:0;width:8px;height:8px;background:#FF00FF;pointer-events:none;"></div>
  <div class="bx-header">??? 背景 ・ Background-Clip 与 Origin 测试</div>
  <div class="bc-row">
    <div class="bc-item"><div class="bc-label">background-clip: border-box（默认）</div><div class="bc-box bc-border">背景覆盖到边框区</div></div>
    <div class="bc-item"><div class="bc-label">background-clip: padding-box</div><div class="bc-box bc-padding">背景只到内边距区</div></div>
    <div class="bc-item"><div class="bc-label">background-clip: content-box</div><div class="bc-box bc-content">背景只到内容区域</div></div>
    <div class="bc-item"><div class="bc-label">background-origin: content-box</div><div class="bc-origin">背景从内容区开始</div></div>
  </div>
  <div class="bx-footer">case-041: Background ― Clip &amp; Origin</div>
<div data-px-anchor="br" style="position:absolute;bottom:0;right:0;width:8px;height:8px;background:#00FFFF;pointer-events:none;"></div></div>
</body></html>

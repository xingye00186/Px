<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Text — Font Weight</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#f0f2f5; font-family:sans-serif; display:flex; justify-content:center; padding:20px; }
  .bx-card { width:720px; background:#fff; border-radius:12px; padding:28px; box-shadow:0 2px 12px rgba(0,0,0,.08); }
  .bx-header { font-size:20px; font-weight:700; margin-bottom:20px; color:#1a1a2e; border-bottom:2px solid #e94560; padding-bottom:12px; }
  .fw-section { margin-bottom:12px; padding:16px; background:#f8f9ff; border-radius:8px; border:1px solid #e0e0e0; }
  .fw-compare { display:flex; gap:16px; margin-bottom:16px; }
  .fw-compare div { flex:1; padding:16px; border-radius:8px; text-align:center; }
  .bx-footer { margin-top:16px; padding-top:14px; border-top:1px solid #eee; font-size:12px; color:#aaa; text-align:center; }
</style></head><body>
<div class="bx-card">
  <div class="bx-header">?? 文本 · 字重测试</div>
  <div class="fw-section">
    <div>font-weight 对比</div>
    <div style="display:flex;gap:24px;align-items:center;">
      <span style="font-weight:100;font-size:16px;">100 Thin</span>
      <span style="font-weight:300;font-size:16px;">300 Light</span>
      <span style="font-weight:400;font-size:16px;">400 Regular</span>
      <span style="font-weight:500;font-size:16px;">500 Medium</span>
      <span style="font-weight:700;font-size:16px;color:#0f3460;">700 Bold</span>
      <span style="font-weight:900;font-size:16px;color:#e94560;">900 Black</span>
    </div>
  </div>
  <div class="fw-compare">
    <div style="background:#f8f9ff;border:1px solid #e0e0e0;"><div style="font-size:11px;color:#999;margin-bottom:4px;">normal</div><div style="font-weight:400;font-size:18px;">Normal</div></div>
    <div style="background:#fff7ed;border:1px solid #fb923c;"><div style="font-size:11px;color:#999;margin-bottom:4px;">bold</div><div style="font-weight:700;font-size:18px;color:#0f3460;">Bold</div></div>
  </div>
  <div class="bx-footer">case-024: Text — Font Weight</div>
</div>
</body></html>

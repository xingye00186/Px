<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Text ― Line Height</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#f0f2f5; font-family:sans-serif; display:flex; justify-content:center; padding:20px; }
  .bx-card { width:720px; background:#fff; border-radius:12px; padding:28px; box-shadow:0 2px 12px rgba(0,0,0,.08);position:relative;}
  .bx-header { font-size:20px; font-weight:700; margin-bottom:20px; color:#1a1a2e; border-bottom:2px solid #e94560; padding-bottom:12px; }
  .lh-compare { display:flex; gap:16px; margin-bottom:16px; }
  .lh-card { flex:1; padding:14px; background:#f8f9ff; border-radius:8px; border:1px solid #e0e0e0; }
  .lh-card div:first-child { font-size:11px; color:#999; margin-bottom:8px; }
  .bx-footer { margin-top:16px; padding-top:14px; border-top:1px solid #eee; font-size:12px; color:#aaa; text-align:center; }
</style></head><body>
<div class="bx-card">
<div style="position:absolute;top:0;left:0;width:8px;height:8px;background:#FF00FF;pointer-events:none;"></div>
  <div class="bx-header">?? 文本 ・ 行高测试</div>
  <div class="lh-compare">
    <div class="lh-card"><div>line-height: normal(默认)</div><div style="font-size:14px;line-height:normal;color:#444;">normal行高<br>第2行<br>第3行</div></div>
    <div class="lh-card"><div>line-height: 1.8 (倍)</div><div style="font-size:14px;line-height:1.8;color:#444;">宽松行高<br>第2行<br>第3行</div></div>
  </div>
  <div class="lh-compare">
    <div class="lh-card"><div>line-height: 24px (固定)</div><div style="font-size:14px;line-height:24px;color:#444;">固定24px行高<br>第2行<br>第3行</div></div>
    <div class="lh-card"><div>line-height: 1.2 (紧凑)</div><div style="font-size:14px;line-height:1.2;color:#444;">紧凑行高<br>第2行<br>第3行</div></div>
  </div>
  <div class="bx-footer">case-021: Text ― Line Height</div>

<div style="position:absolute;bottom:0;right:0;width:8px;height:8px;background:#00FFFF;pointer-events:none;"></div></div>
</body></html>

<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Text ― Text-Indent &amp; Transform</title>
<style>
html,body { width:1600px; min-height:800px; height:auto; overflow:hidden; font-family:"Segoe UI","Noto Sans SC",sans-serif; font-size:16px; line-height:1.2; background:#fff; color:#000; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#f0f2f5; font-family:sans-serif; padding:20px; }
.bx-header { font-size:20px; font-weight:700; margin-bottom:20px; color:#1a1a2e; border-bottom:2px solid #e94560; padding-bottom:12px; }
.ti-row { display:flex; flex-direction:column; gap:16px; margin-bottom:16px; }
.ti-item { padding:16px; background:#f9f9f9; border-radius:6px; border:1px solid #e0e0e0; }
.ti-none { font-size:16px; color:#333; text-indent:0; }
.ti-2em { font-size:16px; color:#333; text-indent:2em; }
.ti-40px { font-size:16px; color:#333; text-indent:40px; }
.tt-upper { font-size:18px; color:#333; text-transform:uppercase; }
.tt-lower { font-size:18px; color:#333; text-transform:lowercase; }
.tt-cap { font-size:18px; color:#333; text-transform:capitalize; }
.bx-footer { margin-top:16px; padding-top:14px; border-top:1px solid #eee; font-size:12px; color:#aaa; text-align:center; }
</style></head><body>
<div style="width:800px;box-sizing:border-box;background:#fff;border-radius:8px;padding:24px;border:1px solid #e0e0e0;position:relative">
<div data-px-anchor="tl" style="position:absolute;top:0;left:0;width:8px;height:8px;background:#FF00FF;pointer-events:none;"></div>
  <div class="bx-header">??? 文本 ・ Text-Indent 缩进与 Transform 转换测试</div>
  <div class="ti-row">
    <div class="ti-item"><div class="ti-none">无缩进：这是测试段落文字，用于验证 text-indent 属性的渲染效果。</div></div>
    <div class="ti-item"><div class="ti-2em">缩进2em：这是测试段落文字，text-indent 设置为 2em，首行应缩进两个字符宽度。</div></div>
    <div class="ti-item"><div class="ti-40px">缩进40px：这是测试段落文字，验证固定像素值缩进。</div></div>
    <div class="ti-item">
      <span class="tt-upper">uppercase 大写转换</span><br>
      <span class="tt-lower">LOWERCASE 小写转换</span><br>
      <span class="tt-cap">capitalize each word 首字母大写</span>
    </div>
  </div>
  <div class="bx-footer">case-035: Text ― Text-Indent &amp; Transform</div>
<div data-px-anchor="br" style="position:absolute;bottom:0;right:0;width:8px;height:8px;background:#00FFFF;pointer-events:none;"></div></div>
</body></html>

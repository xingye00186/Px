<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>case-051: aspect-ratio</title>
<style>
html,body {width:1600px;height:800px;overflow:hidden;font-family:"Segoe UI","Noto Sans SC",sans-serif;font-size:16px;line-height:1.2;background:#fff;color:#000;}
* {box-sizing: border-box; margin: 0; padding: 0;line-height:0;}
body {background:#f0f2f5;display:flex;justify-content:center;padding:20px;}
</style></head><body>
<div data-px-testroot="true" style="width:800px;box-sizing:border-box;background:#fff;border-radius:8px;padding:24px;border:1px solid #e0e0e0;position:relative">
<div data-px-anchor="tl" style="position:absolute;top:0;left:0;width:8px;height:8px;background:#FF00FF;pointer-events:none"></div>
  <div style="display:flex;gap:16px;flex-direction:column">
    <div style="width:200px;aspect-ratio:16/9;background:#e3f2fd;border-radius:4px;display:flex;align-items:center;justify-content:center"><span style="display:inline-block;width:80px;height:25px;background:#b0b0b0"></span></div>
    <div style="height:100px;aspect-ratio:4/3;background:#fce4ec;border-radius:4px;display:flex;align-items:center;justify-content:center"><span style="display:inline-block;width:80px;height:25px;background:#b0b0b0"></span></div>
    <div style="width:160px;aspect-ratio:1;background:#e8f5e9;border-radius:4px;display:flex;align-items:center;justify-content:center"><span style="display:inline-block;width:80px;height:25px;background:#b0b0b0"></span></div>
  </div>
<div data-px-anchor="br" style="position:absolute;bottom:0;right:0;width:8px;height:8px;background:#00FFFF;pointer-events:none"></div></div>
</body></html>

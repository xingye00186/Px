<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Text ― Text-Shadow</title>
<style>
html,body { width:1600px; min-height:800px; height:auto; overflow:hidden; font-family:"Segoe UI","Noto Sans SC",sans-serif; font-size:16px; line-height:1.2; background:#fff; color:#000; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#f0f2f5; font-family:sans-serif; padding:20px; }
.bx-header { font-size:20px; font-weight:700; margin-bottom:20px; color:#1a1a2e; border-bottom:2px solid #e94560; padding-bottom:12px; }
.ts-row { display:flex; flex-direction:column; gap:16px; margin-bottom:16px; }
.ts-item { padding:16px; background:#f9f9f9; border-radius:6px; border:1px solid #e0e0e0; }
.ts-demo1 { font-size:24px; font-weight:700; color:#333; text-shadow:2px 2px 4px rgba(0,0,0,0.3); }
.ts-demo2 { font-size:24px; font-weight:700; color:#e94560; text-shadow:0 0 8px rgba(233,69,96,0.5); }
.ts-demo3 { font-size:24px; font-weight:700; color:#0f3460; text-shadow:-2px -2px 4px rgba(0,0,0,0.2); }
.ts-label { font-size:14px; color:#888; margin-top:4px; }
.bx-footer { margin-top:16px; padding-top:14px; border-top:1px solid #eee; font-size:12px; color:#aaa; text-align:center; }
</style></head><body>
<div style="width:800px;box-sizing:border-box;background:#fff;border-radius:8px;padding:24px;border:1px solid #e0e0e0;position:relative">
<div data-px-anchor="tl" style="position:absolute;top:0;left:0;width:8px;height:8px;background:#FF00FF;pointer-events:none;"></div>
  <div class="bx-header">??? 文本 ・ Text-Shadow 阴影测试</div>
  <div class="ts-row">
    <div class="ts-item"><div class="ts-demo1">文字阴影(2px 2px 4px)</div><div class="ts-label">text-shadow: 2px 2px 4px rgba(0,0,0,0.3)</div></div>
    <div class="ts-item"><div class="ts-demo2">发光文字(0 0 8px)</div><div class="ts-label">text-shadow: 0 0 8px rgba(233,69,96,0.5)</div></div>
    <div class="ts-item"><div class="ts-demo3">偏移阴影(-2px -2px 4px)</div><div class="ts-label">text-shadow: -2px -2px 4px rgba(0,0,0,0.2)</div></div>
  </div>
  <div class="bx-footer">case-033: Text ― Text-Shadow</div>
<div data-px-anchor="br" style="position:absolute;bottom:0;right:0;width:8px;height:8px;background:#00FFFF;pointer-events:none;"></div></div>
</body></html>

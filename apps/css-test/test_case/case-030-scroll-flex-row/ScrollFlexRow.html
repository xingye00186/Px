<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>Scroll Flex Row</title>
<style>
/* PxTest baseline — mandatory: viewport + font + background */
html,body {
    width:1600px;
    min-height:800px;
    height:auto;
    overflow:hidden;
    font-family:"Segoe UI","Noto Sans SC",sans-serif;
    font-size:16px;
    line-height:1.2;
    background:#fff;
    color:#000;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #f5f5f5; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
.card { width:800px; margin:0 auto; background:#fff; border-radius:12px; padding:24px; border:1px solid #e0e0e0; box-shadow:0 2px 12px rgba(0,0,0,.08); position:relative; }
.flex-host { width:100%; height:200px; display:flex; flex-direction:row; border:2px solid #2e7d32; border-radius:6px; background:#fafafa; }
.side-panel { width:60px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:#e8f5e9; font-size:12px; color:#2e7d32; }
.scroll-area { flex:1; overflow-x:auto; min-width:0; padding:60px 0 0 0; background:#fafafa; }
.inner-row { display:flex; flex-direction:row; gap:8px; padding:0 8px; }
.item { width:100px; height:80px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px; border-radius:6px; border:1px solid #c8e6c9; }
.item:nth-child(4n+1) { background:#e8f5e9; }
.item:nth-child(4n+2) { background:#ffffff; }
.item:nth-child(4n+3) { background:#f1f8e9; }
.item:nth-child(4n+4) { background:#e0f2f1; }
</style>

<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Layout ― Display None</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#f0f2f5; font-family:sans-serif; padding:20px; }
.bx-card { width:800px; background:#fff; border-radius:12px; padding:28px; position:relative; }
.bx-header { font-size:20px; font-weight:700; margin-bottom:20px; color:#1a1a2e; border-bottom:2px solid #e94560; padding-bottom:12px; }
.bx-row { display:flex; gap:16px; margin-bottom:16px; }
.bx-desc { font-size:13px; color:#888; line-height:1.6; background:#fafafa; padding:12px; border-radius:6px; }
.bx-footer { margin-top:16px; padding-top:14px; border-top:1px solid #eee; font-size:12px; color:#aaa; text-align:center; }
code { background:#f0f0f0; padding:2px 6px; border-radius:3px; }
</style></head><body>
<div class="bx-card">
<div style="position:absolute;top:0;left:0;width:8px;height:8px;background:#FF00FF;pointer-events:none;"></div>
  <div class="bx-header">?? 布局 ・ Display None 测试</div>
  <div class="bx-row">
    <div style="flex:1;padding:20px;background:#f8f9ff;border-radius:8px;text-align:center;border:1px solid #e0e0e0;">可见元素 A</div>
    <div id="hidden-el" style="flex:1;padding:20px;background:#f8f9ff;border-radius:8px;text-align:center;border:1px solid #e0e0e0;display:none;">隐藏元素(display:none)</div>
    <div style="flex:1;padding:20px;background:#f8f9ff;border-radius:8px;text-align:center;border:1px solid #e0e0e0;">可见元素 B</div>
  </div>
  <div class="bx-desc">
    <code>display:none</code> 的元素应不占空间，A 和 B 应紧邻排列。
  </div>
  <div class="bx-footer">case-010: Layout ― Display None</div>

<div style="position:absolute;bottom:0;right:0;width:8px;height:8px;background:#00FFFF;pointer-events:none;"></div></div>
</body></html>

<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>Scroll Grid</title>
<style>
/* PxTest baseline — mandatory: viewport + font + background */
html,body {
    width:1600px;
    min-height:800px;
    height:auto;
    overflow:hidden;
    font-family:"Segoe UI","Noto Sans SC",sans-serif;
    font-size:16px;
    line-height:1.2;
    background:#fff;
    color:#000;
}

* { box-sizing: border-box; margin: 0; padding: 0; line-height:0;}
body { background: #f5f5f5; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
.card { width:800px; margin:0 auto; background:#fff; border-radius:12px; padding:24px; border:1px solid #e0e0e0; box-shadow:0 2px 12px rgba(0,0,0,.08); position:relative; }
.grid-host { width:100%; height:350px; display:grid; grid-template-columns:120px 1fr 120px; border:2px solid #6a1b9a; border-radius:6px; background:#fafafa; }
.sidebar { display:flex; align-items:center; justify-content:center; background:#f3e5f5; font-size:12px; color:#6a1b9a; padding:8px; }
.scroll-area { overflow-y:auto; padding:4px 0; background:#fafafa; }
.item { height:36px; display:flex; align-items:center; padding:0 12px; font-size:13px; border-bottom:1px solid #e0e0e0; }
.item:nth-child(4n+1) { background:#f3e5f5; }
.item:nth-child(4n+2) { background:#ffffff; }
.item:nth-child(4n+3) { background:#f5f5f5; }
.item:nth-child(4n+4) { background:#ede7f6; }
.num { display:inline-block; width:32px; font-weight:700; color:#6a1b9a; }
.label { color:#37474f; }
.hint { margin-left:10px; font-size:11px; color:#aaa; }
</style>
</head>

<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Layout ― Negative Margin</title>
<style>
/* PxTest baseline — mandatory: viewport + font + background */
html,body {
    width:1600px;
    min-height:800px;
    height:auto;
    overflow:hidden;
    font-family:"Segoe UI","Noto Sans SC",sans-serif;
    font-size:16px;
    line-height:1.2;
    background:#fff;
    color:#000;
}

  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#f0f2f5; font-family:sans-serif; padding:20px; }
  .bx-header { font-size:20px; font-weight:700; margin-bottom:20px; color:#1a1a2e; border-bottom:2px solid #e94560; padding-bottom:12px; }
  .bx-desc { font-size:13px; color:#888; margin-bottom:16px; line-height:1.5; }
  .nm-container { position:relative; background:#f8f9ff; border-radius:8px; padding:20px; border:1px solid #e0e0e0; height:140px; margin-bottom:16px; }
  .nm-base { width:200px; height:80px; background:linear-gradient(135deg,#0f3460,#4facfe); border-radius:6px; color:#fff; display:flex; align-items:center; justify-content:center; }
  .nm-overlap { width:180px; height:60px; background:linear-gradient(135deg,#e94560,#f093fb); border-radius:6px; color:#fff; display:flex; align-items:center; justify-content:center; margin-top:-30px; margin-left:40px; }
  .bx-footer { margin-top:16px; padding-top:14px; border-top:1px solid #eee; font-size:12px; color:#aaa; text-align:center; }
</style></head><body>
<div style="width:800px;box-sizing:border-box;background:#fff;border-radius:8px;padding:24px;border:1px solid #e0e0e0;position:relative">
<div data-px-anchor="tl" style="position:absolute;top:0;left:0;width:8px;height:8px;background:#FF00FF;pointer-events:none;"></div>
  <div class="bx-header">? 布局 ・ 负 Margin 测试</div>
  <div class="bx-desc">负 margin-top 和 margin-left 可使元素偏移，常用于重叠效果</div>
  <div class="nm-container">
    <div class="nm-base">基准元素</div>
    <div class="nm-overlap">负margin-top: -30</div>
  </div>
  <div class="bx-footer">case-017: Layout ― Negative Margin</div>

<div data-px-anchor="br" style="position:absolute;bottom:0;right:0;width:8px;height:8px;background:#00FFFF;pointer-events:none;"></div></div>
</body></html>

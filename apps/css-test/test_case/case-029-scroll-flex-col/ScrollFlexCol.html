<style>/* PxTest baseline — mandatory: viewport + font + background */
html,body{width:1600px;

    height:auto;
    overflow:hidden;
    
    
    line-height:1.2;
    background:#fff;}
* { box-sizing: border-box; margin: 0; padding: 0; line-height:0;
body { background: #f5f5f5; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
.card{width:800px; margin:0 auto; background:#fff; border-radius:12px; padding:24px; border:1px solid #e0e0e0; box-shadow:0 2px 12px rgba(0,0,0,.08); position:relative;}
.flex-host{height:250px; display:flex; flex-direction:column; border:2px solid #e65100; border-radius:6px; background:#fafafa;}
.header{height:52px; flex-shrink:0; display:flex; align-items:center; padding:0 16px; background:#fff3e0; border-bottom:1px solid #e65100;}
.scroll-area{flex:1; overflow-y:auto; min-height:0; padding:4px 0; background:#fafafa;}
.footer{height:52px; flex-shrink:0; display:flex; align-items:center; padding:0 16px; background:#fff3e0; border-top:1px solid #e65100;}
.item{height:36px; display:flex; align-items:center; padding:0 14px;  border-bottom:1px solid #e0e0e0;}
.item:nth-child(5n+1){background:#fff3e0;}
.item:nth-child(5n+2){background:#ffffff;}
.item:nth-child(5n+3){background:#f5f5f5;}
.item:nth-child(5n+4){background:#fbe9e7;}
.item:nth-child(5n+5){background:#fff8e1;}
.num{display:inline-block; width:36px;}
.hint{margin-left:10px;}</style>

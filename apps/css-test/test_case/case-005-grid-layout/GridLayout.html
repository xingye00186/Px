<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>Grid Layout Test</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #f5f5f5; font-size: 14px; line-height: 1.5; }
</style>
</head>
<body>
<div style="width:800px;background:#fff;border-radius:8px;padding:24px;border:1px solid #e0e0e0;">
  <div style="font-size:18px;font-weight:600;margin-bottom:16px;color:#333;">
    Grid Layout Test
  </div>

  <div style="font-size:14px;font-weight:600;color:#666;margin-bottom:8px;">2-column grid:</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;">
    <div style="height:60px;background:#e3f2fd;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#1565c0;">Left cell</div>
    <div style="height:60px;background:#fce4ec;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#c62828;">Right cell</div>
    <div style="height:60px;background:#e8f5e9;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#2e7d32;">Bottom left</div>
    <div style="height:60px;background:#fff3e0;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#e65100;">Bottom right</div>
  </div>

  <div style="font-size:14px;font-weight:600;color:#666;margin-bottom:8px;">3-column grid (uneven):</div>
  <div style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;">
    <div style="height:50px;background:#f3e5f5;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#6a1b9a;">2fr</div>
    <div style="height:50px;background:#e0f2f1;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#00695c;">1fr</div>
    <div style="height:50px;background:#fce4ec;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#c62828;">1fr</div>
  </div>
</div>
</body>
</html>

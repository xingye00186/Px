<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Case 001 - Wrapper X Test</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#f5f5f5; font-family:sans-serif; }
  .sandbox { padding:20px; }
  .wrapper-test {
    width:800px; margin:0 auto; background:#fff; border-radius:8px;
    padding:24px; border:1px solid #e0e0e0;
  }
  .test-header { font-size:18px; font-weight:600; margin-bottom:16px; color:#333; }
  .test-body { font-size:14px; color:#666; line-height:1.6; }
  .test-footer { margin-top:16px; padding-top:16px; border-top:1px solid #eee; font-size:12px; color:#999; }
</style>
</head>
<body>
<div class="sandbox">
  <div class="wrapper-test">
    <div class="test-header">Centered Wrapper Test (margin: 0 auto)</div>
    <div class="test-body">
      <p>This container is 800px wide with margin:0 auto.</p>
      <p>The sandbox is 1600px wide with 20px padding.</p>
      <p>Expected x = (1600 - 800 - 2*20) / 2 = 380px</p>
    </div>
    <div class="test-footer">case-001: wrapper x-position verification</div>
  </div>
</div>
</body>
</html>

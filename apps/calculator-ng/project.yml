name: calculator-ng
mode: bin
no-console: false
job: 8
platform: win32
entry: main.php
cxx-flags:
  - /utf-8

sources:
  - main.php
  - ./gen
  - ../../framework
  - ../../stub
  - ../../cpp
ignore:
  - ../../framework/Compiler
  - ../../framework/aot-checker.php

# ========================================================================
# Runtime debug config (read by framework/Core/Config.php via Px_debug_ prefix)
# ========================================================================
Px_debug_diag_enabled: true

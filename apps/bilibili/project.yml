name: bilibili
mode: bin
no-console: false
platform: win32
entry: main.php
cxx-flags:
  - /utf-8
  - /wd4267

component-libraries:
  - path: ../../library/vc-ui
    prefix: vc
    mode: auto-register

sources:
  - main.php
  - ./gen
  - ../../framework
  - ../../stub
  - ../../cpp
ignore:
  - ../../framework/compiler
  - ../../framework/aot-checker.php

# ========================================================================
# Runtime debug config (read by framework/Core/Config.php via Px_debug_ prefix)
# ========================================================================
Px_debug_diag_enabled: false
Px_debug_snapshot_enabled: false
Px_debug_snapshot_max_events: 5
Px_debug_snapshot_detail: normal
Px_debug_snapshot_max_size_mb: 5
Px_debug_snapshot_max_backups: 5

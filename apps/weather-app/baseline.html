<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>天气 - 行内样式</title></head>
<body style="margin:0; background:linear-gradient(145deg,#0f172a,#1e293b); font-family:system-ui; padding:32px;">
<div style="max-width:600px; margin:0 auto; background:rgba(255,255,255,0.1); backdrop-filter:blur(12px); border-radius:48px; padding:32px;">
    <div style="display:flex; justify-content:space-between;"><div><div style="color:#cbd5e1;">杭州市</div><div style="font-size:3rem; font-weight:700; color:white;">21°C</div><div style="color:#cbd5e1;">☀️ 晴</div></div><div style="font-size:4rem;">☀️</div></div>
    <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:32px 0;">
        <div style="text-align:center; color:#e2e8f0;">一<br>🌤️<br>18°</div><div style="text-align:center; color:#e2e8f0;">二<br>☁️<br>17°</div><div style="text-align:center; color:#e2e8f0;">三<br>🌧️<br>15°</div><div style="text-align:center; color:#e2e8f0;">四<br>☀️<br>22°</div>
    </div>
    <div style="background:rgba(255,255,255,0.2); border-radius:28px; padding:16px; margin-top:16px;"><div style="display:flex; justify-content:space-between;"><span>💧 湿度</span><span>65%</span></div><div style="display:flex; justify-content:space-between;"><span>🌬️ 风速</span><span>12 km/h</span></div><div style="display:flex; justify-content:space-between;"><span>🌅 日出</span><span>06:32</span></div></div>
</div>
</body>
</html>

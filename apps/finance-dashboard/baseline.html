<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>金融仪表盘 - 行内样式</title></head>
<body style="margin:0; background:linear-gradient(145deg,#0b1120 0%,#0a0f1a 100%); font-family:'Segoe UI',system-ui; padding:24px;">
<div style="max-width:1400px; margin:0 auto;">
    <!-- 头部 -->
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:32px;">
        <div><h1 style="color:#f0f3fa; margin:0; font-size:1.8rem;">📊 投资组合</h1><p style="color:#7f8ea3; margin:4px 0 0;">实时行情 · 智能分析</p></div>
        <div style="background:#1e293b; padding:8px 18px; border-radius:40px; color:#64ffda;">📈 +2.34% 今日</div>
    </div>
    <!-- 指标卡片网格 (Grid) -->
    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); gap:20px; margin-bottom:32px;">
        <div style="background:#1e293b; border-radius:28px; padding:20px; border:1px solid #334155;"><div style="color:#94a3b8;">总资产 (USD)</div><div style="font-size:2rem; font-weight:700; color:#facc15;">$124,582</div><div style="color:#22c55e;">⬆️ +2.4%</div></div>
        <div style="background:#1e293b; border-radius:28px; padding:20px; border:1px solid #334155;"><div style="color:#94a3b8;">日收益</div><div style="font-size:2rem; font-weight:700; color:#e2e8f0;">+$2,890</div><div style="color:#f97316;">⬆️ +5.1%</div></div>
        <div style="background:#1e293b; border-radius:28px; padding:20px; border:1px solid #334155;"><div style="color:#94a3b8;">加密货币</div><div style="font-size:2rem; font-weight:700; color:#facc15;">$32,450</div><div style="color:#22c55e;">⬆️ +12%</div></div>
        <div style="background:#1e293b; border-radius:28px; padding:20px; border:1px solid #334155;"><div style="color:#94a3b8;">股票持仓</div><div style="font-size:2rem; font-weight:700; color:#e2e8f0;">9 只</div><div style="color:#3b82f6;">⏺ 稳定</div></div>
    </div>
    <!-- 图表区域 + 持仓列表 Flex 混合 -->
    <div style="display:flex; flex-wrap:wrap; gap:24px;">
        <div style="flex:2; min-width:260px; background:#1e293b; border-radius:28px; padding:20px; border:1px solid #334155;">
            <div style="display:flex; justify-content:space-between; margin-bottom:16px;"><span style="font-weight:600; color:#e2e8f0;">📈 走势 (模拟)</span><span style="color:#64ffda;">7d</span></div>
            <div style="height:200px; background:#0f172a; border-radius:20px; display:flex; align-items:center; justify-content:center; color:#475569;">📊 趋势图区</div>
        </div>
        <div style="flex:1.5; background:#1e293b; border-radius:28px; padding:20px; border:1px solid #334155;">
            <div style="font-weight:600; margin-bottom:12px; color:#e2e8f0;">📋 热门持仓</div>
            <div><div style="display:flex; justify-content:space-between; margin:8px 0;"><span>NVDA</span><span style="color:#22c55e;">+5.2%</span></div><div style="height:4px; background:#334155; border-radius:2px;"><div style="width:65%; height:4px; background:#3b82f6; border-radius:2px;"></div></div></div>
            <div><div style="display:flex; justify-content:space-between; margin:8px 0;"><span>BTC</span><span style="color:#22c55e;">+12%</span></div><div style="height:4px; background:#334155; border-radius:2px;"><div style="width:80%; height:4px; background:#facc15; border-radius:2px;"></div></div></div>
            <div><div style="display:flex; justify-content:space-between; margin:8px 0;"><span>AAPL</span><span style="color:#f97316;">-0.3%</span></div><div style="height:4px; background:#334155; border-radius:2px;"><div style="width:30%; height:4px; background:#ef4444; border-radius:2px;"></div></div></div>
        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>Level 0 - Px</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0d1117; color: #e6edf3; font-size: 14px; line-height: 1.7; }
* {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b1120;
            font-family: 'Inter', system-ui, sans-serif;
            padding: 32px;
            color: #e2e8f0;
        }
        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            font-size: 1.6rem;
            margin-bottom: 8px;
        }
        .grid-overview {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            margin: 28px 0 32px;
        }
        .metric-card {
            background: #1e293b;
            border-radius: 24px;
            padding: 20px;
            border: 1px solid #334155;
        }
        .metric-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #94a3b8;
        }
        .metric-value {
            font-size: 2.2rem;
            font-weight: 700;
            margin-top: 8px;
        }
        .trend-up { color: #22c55e; }
        .grid-main {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
        }
        .card {
            background: #1e293b;
            border-radius: 24px;
            padding: 24px;
            border: 1px solid #334155;
        }
        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
            border-left: 4px solid #3b82f6;
            padding-left: 12px;
        }
        .chart-placeholder {
            background: #0f172a;
            height: 200px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
        }
        .progress-item {
            margin: 16px 0;
        }
        .progress-bar-bg {
            background: #334155;
            border-radius: 10px;
            height: 8px;
            overflow: hidden;
        }
        .progress-fill {
            width: 75%;
            height: 8px;
            background: #3b82f6;
            border-radius: 10px;
        }
        .circle-mock {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: conic-gradient(#3b82f6 0deg 270deg, #334155 270deg 360deg);
            margin: 0 auto 16px;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        @media (max-width: 900px) {
            .grid-overview { grid-template-columns: repeat(2,1fr); }
            .grid-main { grid-template-columns: 1fr; }
        }
</style>
</head>
<body>
<div class="dashboard">
    <h1>📡 系统监控看板</h1>
    <div class="grid-overview">
        <div class="metric-card"><div class="metric-label">CPU 使用率</div><div class="metric-value">34%</div></div>
        <div class="metric-card"><div class="metric-label">内存占用</div><div class="metric-value">8.2 GB</div></div>
        <div class="metric-card"><div class="metric-label">磁盘 IO</div><div class="metric-value trending-up">124 MB/s</div></div>
        <div class="metric-card"><div class="metric-label">网络吞吐</div><div class="metric-value">342 Mbps</div></div>
    </div>
    <div class="grid-main">
        <div class="card">
            <div class="card-title">实时请求量 (RPS)</div>
            <div class="chart-placeholder">📈 模拟折线图区域</div>
            <div class="flex-between" style="margin-top: 20px;"><span>平均延迟</span><span>128ms</span></div>
            <div class="flex-between"><span>峰值</span><span>346ms</span></div>
        </div>
        <div class="card">
            <div class="card-title">服务健康度</div>
            <div class="circle-mock"></div>
            <div class="progress-item">
                <div class="flex-between"><span>API 网关</span><span>99.8%</span></div>
                <div class="progress-bar-bg"><div class="progress-fill" style="width:99.8%"></div></div>
            </div>
            <div class="progress-item">
                <div class="flex-between"><span>数据库</span><span>95.2%</span></div>
                <div class="progress-bar-bg"><div class="progress-fill" style="width:95.2%"></div></div>
            </div>
            <div class="progress-item">
                <div class="flex-between"><span>缓存服务</span><span>100%</span></div>
                <div class="progress-bar-bg"><div class="progress-fill" style="width:100%"></div></div>
            </div>
        </div>
    </div>
</div>
</body>
</html>

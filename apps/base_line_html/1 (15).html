<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>在线教育 - 行内样式</title></head>
<body style="margin:0; background:#fef9e8; font-family:'Segoe UI',sans-serif; padding:32px;">
<div style="max-width:1200px; margin:0 auto;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:32px;"><h1 style="margin:0;">📚 我的课程</h1><div style="background:#1e293b; color:white; padding:8px 20px; border-radius:40px;">👤 用户中心</div></div>
    <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:28px;">
        <div style="background:white; border-radius:28px; overflow:hidden; box-shadow:0 6px 14px rgba(0,0,0,0.05);"><div style="height:140px; background:#3b82f6;"></div><div style="padding:20px;"><div style="font-weight:700; font-size:1.1rem;">JavaScript 进阶</div><div style="color:#6c757d;">已完成 65%</div><div style="height:6px; background:#e2e8f0; border-radius:3px; margin:12px 0;"><div style="width:65%; height:6px; background:#3b82f6; border-radius:3px;"></div></div><button style="background:#f8fafc; border:1px solid #ccc; border-radius:40px; padding:8px; width:100%;">继续学习</button></div></div>
        <div style="background:white; border-radius:28px;"><div style="height:140px; background:#10b981;"></div><div style="padding:20px;"><div style="font-weight:700; font-size:1.1rem;">Vue 3 实战</div><div style="color:#6c757d;">已完成 30%</div><div style="height:6px; background:#e2e8f0; border-radius:3px; margin:12px 0;"><div style="width:30%; height:6px; background:#10b981; border-radius:3px;"></div></div><button style="background:#f8fafc; border:1px solid #ccc; border-radius:40px; padding:8px; width:100%;">开始学习</button></div></div>
        <div style="background:white; border-radius:28px;"><div style="height:140px; background:#f59e0b;"></div><div style="padding:20px;"><div style="font-weight:700; font-size:1.1rem;">Python 数据分析</div><div style="color:#6c757d;">已完成 90%</div><div style="height:6px; background:#e2e8f0; border-radius:3px; margin:12px 0;"><div style="width:90%; height:6px; background:#f59e0b; border-radius:3px;"></div></div><button style="background:#f8fafc; border:1px solid #ccc; border-radius:40px; padding:8px; width:100%;">继续学习</button></div></div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><style>*{box-sizing:border-box;margin:0;padding:0;}html,body{width:1600px;height:800px;font-family:"Segoe UI","Noto Sans SC",sans-serif;font-size:16px;background:#fff;}</style></head><body><div style="width:800px;position:relative;"><div style="position:absolute;top:0;left:0;width:8px;height:8px;background:#FF00FF;pointer-events:none;" data-px-anchor="tl"></div><div style="font-size:18px;font-weight:600;color:#333;margin-bottom:12px;">Complex Form</div><div style="font-size:18px;font-weight:600;color:#333;margin-bottom:8px;">Complex Form</div><div style="width:580px;background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:20px;">  <div style="font-size:16px;font-weight:600;color:#333;margin-bottom:16px;">Registration Form</div>  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">    <div style="display:flex;flex-direction:column;gap:4px;">      <span style="font-size:13px;font-weight:600;color:#555;">First Name</span>      <div style="height:36px;background:#f5f5f5;border:1px solid #ccc;border-radius:4px;"></div>    </div>    <div style="display:flex;flex-direction:column;gap:4px;">      <span style="font-size:13px;font-weight:600;color:#555;">Last Name</span>      <div style="height:36px;background:#f5f5f5;border:1px solid #ccc;border-radius:4px;"></div>    </div>    <div style="grid-column:span 2;display:flex;flex-direction:column;gap:4px;">      <span style="font-size:13px;font-weight:600;color:#555;">Email</span>      <div style="height:36px;background:#f5f5f5;border:1px solid #ccc;border-radius:4px;"></div>    </div>    <div style="grid-column:span 2;display:flex;flex-direction:column;gap:4px;">      <span style="font-size:13px;font-weight:600;color:#555;">Bio</span>      <div style="height:80px;background:#f5f5f5;border:1px solid #ccc;border-radius:4px;"></div>    </div>  </div>  <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px;">    <div style="width:80px;height:36px;background:#e0e0e0;border:1px solid #999;border-radius:4px;display:flex;align-items:center;justify-content:center;">      <span style="font-size:13px;">Cancel</span>    </div>    <div style="width:100px;height:36px;background:#1976d2;border:1px solid #0d47a1;border-radius:4px;display:flex;align-items:center;justify-content:center;">      <span style="font-size:13px;color:#fff;">Submit</span>    </div>  </div></div><div style="position:absolute;bottom:0;right:0;width:8px;height:8px;background:#00FFFF;pointer-events:none;" data-px-anchor="br"></div></div></body></html>
